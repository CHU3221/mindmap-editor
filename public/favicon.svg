<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- 배경 딥 인디고 그라데이션 -->
    <linearGradient id="bgIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- 베이스 라운드 스퀘어 -->
  <rect width="64" height="64" rx="16" fill="url(#bgIndigo)" />

  <!-- 마인드맵 연결선 (가로, 세로, 대각선) -->
  <!-- 1. 우상단 대각선 (코랄 핑크) -->
  <line x1="32" y1="32" x2="47" y2="17" stroke="#F43F5E" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- 2. 가로 우측 (앰버/골드) -->
  <line x1="32" y1="32" x2="49" y2="32" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- 3. 세로 하단 (에메랄드 그린) -->
  <line x1="32" y1="32" x2="32" y2="49" stroke="#10B981" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- 4. 좌상단 대각선 (스카이 시안) -->
  <line x1="32" y1="32" x2="17" y2="17" stroke="#06B6D4" stroke-width="4.5" stroke-linecap="round" />

  <!-- 각 브랜치 끝 서브 노드 (선명한 단색 원형) -->
  <circle cx="17" cy="17" r="5" fill="#22D3EE" />
  <circle cx="47" cy="17" r="5" fill="#FB7185" />
  <circle cx="49" cy="32" r="5" fill="#FBBF24" />
  <circle cx="32" cy="49" r="5" fill="#34D399" />

  <!-- 중심 메인 노드 (화이트 코어 + 퍼플 포인트) -->
  <circle cx="32" cy="32" r="8" fill="#818CF8" />
  <circle cx="32" cy="32" r="4.5" fill="#FFFFFF" />
</svg>